[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
stonkfolio_distributor = "C4mQLDEnnFupVCwQbr9Bzygr9kJaowRTmmUEb9FoFaLh"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test`'s own script runner shells out via a path that resolves to a
# broken WSL install on this machine, not Git Bash's sh — if that gets fixed,
# `anchor test` becomes the one-command path again. Until then: start
# `solana-test-validator` yourself, `anchor deploy`, then `npm test` directly.
test = "npm test"
